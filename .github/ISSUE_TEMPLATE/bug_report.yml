# Modified for Praxis Swarm: fork-specific evidence fields; no inherited community promises.
name: Bug report
description: Report unexpected behavior in Praxis Swarm.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe what you did and what went wrong. A diagnosis is not required.
    validations:
      required: true
  - type: dropdown
    id: workflow
    attributes:
      label: Which workflow?
      options:
        - Offline demo or tests
        - Supervised swarm CLI with real model sessions
        - Other inherited AO behavior
        - Unsure
    validations:
      required: false
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction and expected result
      description: Include the command or steps, what you expected, and how often it happens. Partial reproduction details are welcome.
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Checkout and environment
      description: Commit or version, OS/architecture, relevant tool versions, and model/effort if a live run was involved. Do not include account credentials.
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: Relevant evidence
      description: Optional report excerpt, error or screenshot. Mark passed, failed, skipped and not-run checks accurately. Remove secrets, personal paths and unrelated task content.
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        Keep observations separate from suggested causes. For setup and scope, see the [Praxis Swarm guide](https://github.com/sparkplug604/praxis-swarm/blob/main/README.md).
