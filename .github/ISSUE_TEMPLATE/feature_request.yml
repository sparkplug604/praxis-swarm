# Modified for Praxis Swarm: discuss this fork's scope without inherited core-team approval promises.
name: Feature request
description: Propose an improvement to Praxis Swarm.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the user's problem and a concrete outcome. For larger changes, discuss scope here before building. Review timing and acceptance are not guaranteed.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and where does the current workflow fall short?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: What should a user be able to do? Distinguish a proposal from behavior already verified.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and evidence
      description: Workarounds, relevant examples, or checks that would demonstrate the improvement.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Coordination
      options:
        - label: I checked existing issues and pull requests for related work.
          required: false
        - label: I would like to help implement or validate this change.
          required: false
